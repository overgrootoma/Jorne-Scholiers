# Pages CMS configuration (https://pagescms.org).
# Log in at https://app.pagescms.org with GitHub and open this repository.
# Every save is a commit to main; the "Deploy static content to Pages" workflow
# then runs `npm run build` and puts the site online.

media:
  - name: projects
    label: Project images
    input: Projects
    output: /Projects
    rename: safe
    categories: [image, document, video]
  - name: archive
    label: Archive
    input: Archive
    output: /Archive
    rename: safe
    categories: [image, video]
  - name: photography
    label: Photography
    input: photography
    output: /photography
    rename: safe
    categories: [image]

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{fields.year}-{primary}.json"
    view:
      fields: [title, year, order, hidden]
      primary: title
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: one_liner
        label: One-liner
        description: A very short line on what it is, e.g. "Book of generative images" or "Magazine design". Shown under the title on the project page and the Projects overview.
        type: string
      - name: short_title
        label: Short title (optional)
        description: Shown in the homepage list instead of the title, e.g. "STFF".
        type: string
      - name: year
        label: Year
        type: number
        required: true
      - name: order
        label: Position
        description: 1 is the top of the list. Leave empty to place the project at the end.
        type: number
      - name: hidden
        label: Hide this project
        description: Keeps the project off the site without deleting it.
        type: boolean
      - name: folder
        label: Project folder
        description: Only for projects that were set up before the CMS (extra settings such as the Isolation image grid live in Projects/<folder>/page.json). Leave empty for new projects.
        type: string
      - name: cover
        label: Cover image
        description: Used on the Projects overview and when the page is shared.
        type: image
        options:
          media: projects
      - name: description
        label: Text
        description: Leave an empty line between paragraphs.
        type: text
      - name: images
        label: Project images
        description: Shown on the project page in this order (drag to reorder). On desktop the page is a grid of 6 columns; on phones every image is full width, one under the other. Upload new images into a folder for this project, e.g. "2027 Project name".
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{columns} col · {image}"
        fields:
          - name: image
            label: Image
            type: image
            required: true
            options:
              media: projects
          - name: alt
            label: Description for Google and screen readers (alt text)
            description: What is on the image, e.g. "Isolation book open on a spread with a line grid". Empty = automatic.
            type: string
          - name: columns
            label: Width (columns of 6)
            description: 6 = full width, 3 = half, 2 = a third, 1 = a sixth.
            type: select
            options:
              values: ["6", "5", "4", "3", "2", "1"]
          - name: start
            label: Start at column
            description: auto = right after the previous image. Pick a later column to leave empty space before this image.
            type: select
            options:
              values: ["auto", "1", "2", "3", "4", "5", "6"]
          - name: new_row
            label: Start a new row
            description: Leaves the rest of the previous row empty.
            type: boolean
      - name: homepage_images
        label: Homepage hover images
        description: Up to 4 images shown when hovering the project on the homepage. Empty = the first project images.
        type: image
        options:
          media: projects
          multiple:
            max: 4
      - name: files
        label: Files (PDF, video)
        type: object
        list: true
        fields:
          - name: file
            label: File
            type: file
            options:
              media: projects
          - name: label
            label: Link text
            description: e.g. "Isolation Book". Videos are shown on the page, other files as a link.
            type: string
      - name: youtube
        label: YouTube link (optional)
        type: string
      - name: keywords
        label: Keywords (for Google)
        description: The first keyword also goes into the page title, e.g. "Isolation – Creative Coding".
        type: string
        list: true
      - name: seo_title
        label: Google title (optional)
        description: Replaces "Title – First keyword" in Google results. "| Jorne Scholiers" is added automatically.
        type: string
      - name: seo_description
        label: Google description (optional)
        description: One or two sentences shown under the title in Google (max. ~155 characters). Empty = the start of the text.
        type: text

  - name: site
    label: Homepage information
    type: file
    path: content/site.json
    format: json
    fields:
      - name: personal
        label: About
        type: string
        list: true
      - name: exhibitions
        label: Exhibitions
        type: object
        list: true
        fields:
          - name: date
            label: Year or dates
            description: e.g. "2025" or "2023–2026". Shown in front of the text, like the project years.
            type: string
          - name: label
            label: Text
            type: string
            required: true
          - name: href
            label: Link (optional)
            type: string
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - name: date
            label: Year or dates
            description: e.g. "2025" or "2023–2026". Shown in front of the text, like the project years.
            type: string
          - name: label
            label: Text
            type: string
            required: true
          - name: href
            label: Link (optional)
            type: string
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: date
            label: Year or dates
            description: e.g. "2025" or "2023–2026". Shown in front of the text, like the project years.
            type: string
          - name: label
            label: Text
            type: string
            required: true
          - name: href
            label: Link (optional)
            type: string
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Text
            type: string
            required: true
          - name: href
            label: Link
            type: string
