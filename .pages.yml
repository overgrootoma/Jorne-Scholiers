# Pages CMS configuration (https://pagescms.org).
# Log in at https://app.pagescms.org with GitHub and open this repository.
# Every save is a commit to main; the "Deploy static content to Pages" workflow
# then runs `npm run build` and puts the site online.

media:
  - name: projects
    label: Project images
    input: Projects
    output: /Projects
    rename: safe
    categories: [image, document, video]
  - name: archive
    label: Archive
    input: Archive
    output: /Archive
    rename: safe
    categories: [image, video]
  - name: photography
    label: Photography
    input: photography
    output: /photography
    rename: safe
    categories: [image]

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{fields.year}-{primary}.json"
    view:
      fields: [title, year, order, hidden]
      primary: title
      sort: [order, year, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: one_liner
        label: One-liner
        description: A very short line on what it is, e.g. "Book of generative images" or "Magazine design". Shown under the title on the project page and the Projects overview.
        type: string
      - name: tags
        label: Tags (blue blocks)
        description: Simple words for what the project is, e.g. "book", "album art", "installation". Shown as small blue blocks under the title on the project page.
        type: string
        list: true
      - name: short_title
        label: Short title (optional)
        description: Shown in the homepage list instead of the title, e.g. "STFF".
        type: string
      - name: year
        label: Year
        type: number
        required: true
      - name: order
        label: Position
        description: 1 is the top of the list. Leave empty to place the project at the end.
        type: number
      - name: hidden
        label: Hide this project
        description: Keeps the project off the site without deleting it.
        type: boolean
      - name: folder
        label: Project folder
        description: Only for projects that were set up before the CMS (extra settings such as the Isolation image grid live in Projects/<folder>/page.json). Leave empty for new projects.
        type: string
      - name: cover
        label: Cover image
        description: Used on the Projects overview and when the page is shared.
        type: image
        options:
          media: projects
      - name: description
        label: Text
        description: Leave an empty line between paragraphs.
        type: text
      - name: photo_order
        label: Photo order (drag the tiles)
        description: "Easiest: open jornescholiers.be/editor to order and size all photos in one overview. Here: All photos of the page as small tiles. Drag a tile to change the order of the photos on the page. Text sections stay where they are. Adding a tile here also adds that photo to the page (full width); its width and position are set below."
        type: image
        options:
          media: projects
          multiple: true
      - name: images
        label: Project images and text sections
        description: "Width and position of each photo, and the text sections. The order of the photos is set by the tiles in Photo order above; text sections stay at their place in this list. Each row shows: number · short name · width of 6 · new row. Click a row to open it. On desktop and tablet the page is a grid of 6 columns; on phones everything is full width, one under the other. Upload new images into a folder for this project, e.g. \"2027 Project name\"."
        type: block
        # Collapsed rows show a short name instead of the long image path, so the order is easy
        # to scan. Pages CMS can only show text here, not a thumbnail.
        list:
          collapsible:
            collapsed: true
            summary: "{index}.  {name}{title}  ·  {columns}/6 wide  ·  start {start}  ·  new row: {new_row}"
        blockKey: type
        blocks:
          - name: image
            label: Image
            fields:
            - name: name
              label: Short name (shown in the list)
              description: Only for you, so you recognise the image in the list when you reorder, e.g. "bos 2" or "book spread". Not shown on the site.
              type: string
            - name: image
              label: Image
              type: image
              options:
                media: projects
            - name: alt
              label: Description for Google and screen readers (alt text)
              description: What is on the image, e.g. "Isolation book open on a spread with a line grid". Empty = automatic.
              type: string
            - name: columns
              label: Width (columns of 6)
              description: 6 = full width, 3 = half, 2 = a third, 1 = a sixth.
              type: select
              options:
                values: ["6", "5", "4", "3", "2", "1"]
            - name: start
              label: Start at column
              description: auto = right after the previous block. Pick a later column to leave empty space before it.
              type: select
              options:
                values: ["auto", "1", "2", "3", "4", "5", "6"]
            - name: new_row
              label: Start a new row
              description: Leaves the rest of the previous row empty.
              type: boolean
          - name: text
            label: Text section
            fields:
            - name: title
              label: Title (optional)
              type: string
            - name: intro
              label: Introduction (optional, shown larger)
              type: text
            - name: body
              label: Body text (optional)
              description: Leave an empty line between paragraphs.
              type: text
            - name: columns
              label: Width (columns of 6)
              description: 6 = full width, 3 = half, 2 = a third, 1 = a sixth.
              type: select
              options:
                values: ["6", "5", "4", "3", "2", "1"]
            - name: start
              label: Start at column
              description: auto = right after the previous block. Pick a later column to leave empty space before it.
              type: select
              options:
                values: ["auto", "1", "2", "3", "4", "5", "6"]
            - name: new_row
              label: Start a new row
              description: Leaves the rest of the previous row empty.
              type: boolean
      - name: homepage_images
        label: Homepage hover images
        description: Up to 4 images shown when hovering the project on the homepage. Empty = the first project images.
        type: image
        options:
          media: projects
          multiple:
            max: 4
      - name: files
        label: Files (PDF, video)
        type: object
        list: true
        fields:
          - name: file
            label: File
            type: file
            options:
              media: projects
          - name: label
            label: Link text
            description: e.g. "Isolation Book". Videos are shown on the page, other files as a link.
            type: string
      - name: youtube
        label: YouTube link (optional)
        type: string
      - name: keywords
        label: Keywords (for Google)
        description: The first keyword also goes into the page title, e.g. "Isolation – Creative Coding".
        type: string
        list: true
      - name: seo_title
        label: Google title (optional)
        description: Replaces "Title – First keyword" in Google results. "| Jorne Scholiers" is added automatically.
        type: string
      - name: seo_description
        label: Google description (optional)
        description: One or two sentences shown under the title in Google (max. ~155 characters). Empty = the start of the text.
        type: text

  - name: site
    label: Homepage information
    type: file
    path: content/site.json
    format: json
    fields:
      - name: personal
        label: About
        type: string
        list: true
      - name: exhibitions
        label: Exhibitions
        type: object
        list: true
        fields:
          - name: date
            label: Year or dates
            description: e.g. "2025" or "2023–2026". Shown in front of the text, like the project years.
            type: string
          - name: label
            label: Text
            type: string
            required: true
          - name: href
            label: Link (optional)
            type: string
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - name: date
            label: Year or dates
            description: e.g. "2025" or "2023–2026". Shown in front of the text, like the project years.
            type: string
          - name: label
            label: Text
            type: string
            required: true
          - name: href
            label: Link (optional)
            type: string
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: date
            label: Year or dates
            description: e.g. "2025" or "2023–2026". Shown in front of the text, like the project years.
            type: string
          - name: label
            label: Text
            type: string
            required: true
          - name: href
            label: Link (optional)
            type: string
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Text
            type: string
            required: true
          - name: href
            label: Link
            type: string
